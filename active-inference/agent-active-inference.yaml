agent:
  name: active-inference-simulation
  purpose: |
    Simulates interactions between an Active Inference agent and environment.
    Provides:
    1. Environment simulation with three discrete states
    2. Active Inference agent interaction
    3. Comprehensive logging and visualization
    4. Performance analysis and monitoring
  description: |
    A simulation tool that coordinates interaction between an Active Inference agent
    and a simulated environment. Features include:
    
    - Environment: Three-state system (Low, Medium, High)
    - Agent: Active Inference implementation with belief updating and action selection
    - Logging: Detailed JSON logging of all interactions and metrics
    - Visualization: Comprehensive analysis of agent behavior
    
    Ideal for:
    - Testing Active Inference implementations
    - Analyzing agent behavior
    - Validating decision-making processes
    - Generating visualization datasets
  version: "1.0.0"

simulation:
  environment:
    states: ["Low", "Medium", "High"]
    observations: ["Low", "Medium", "High"]
    actions: ["Decrease", "Stay", "Increase"]
    
  agent:
    # Initial model parameters
    n_states: 3
    n_observations: 3
    n_actions: 3
    
    # Observation model P(o|s)
    likelihood_matrix:
      shape: [3, 3]
      values: [
        [0.8, 0.2, 0.0],  # P(o=Low|s)
        [0.1, 0.8, 0.1],  # P(o=Medium|s)
        [0.0, 0.2, 0.8]   # P(o=High|s)
      ]
    
    # Transition dynamics P(s'|s,a)
    transition_matrices:
      shape: [3, 3, 3]
      decrease_action: [
        [0.8, 0.2, 0.0],  # From Low
        [0.7, 0.3, 0.0],  # From Medium
        [0.1, 0.8, 0.1]   # From High
      ]
      stay_action: [
        [0.7, 0.3, 0.0],  # From Low
        [0.2, 0.6, 0.2],  # From Medium
        [0.0, 0.3, 0.7]   # From High
      ]
      increase_action: [
        [0.1, 0.8, 0.1],  # From Low
        [0.0, 0.3, 0.7],  # From Medium
        [0.0, 0.2, 0.8]   # From High
      ]
    
    # Preferences and initial beliefs
    preferences: [0.1, 2.0, 0.1]  # Preference for medium state
    initial_beliefs: [0.333, 0.333, 0.333]  # Uniform initial distribution
    initial_habits: [0.333, 0.333, 0.333]  # Uniform action preferences

logging:
  format: "json"
  fields:
    - timestamp
    - level
    - logger
    - message
    - component
    - event
    - step
    - observation
    - action
    - beliefs
    - free_energy
    - policy
    - timing
  
  metrics:
    - belief_history
    - action_history
    - free_energy_history
    - policy_prior_history
    - epistemic_values
    - pragmatic_values

visualization:
  plots:
    - belief_evolution
    - policy_evolution
    - free_energy_analysis
    - state_action_analysis
    - belief_phase_space
    - value_components
    - summary_dashboard
    - exploration_exploitation
    - action_selection_dynamics
    
  styles:
    colors:
      states: ["#2ecc71", "#3498db", "#e74c3c"]  # Green, Blue, Red
      actions: ["#f1c40f", "#9b59b6", "#1abc9c"]  # Yellow, Purple, Turquoise
    
    plot:
      dpi: 300
      fontsize: 12
      titlesize: 16
      labelsize: 14
      markersize: 6
      linewidth: 2

execution:
  max_steps: 100
  save_history: true
  async_visualization: true