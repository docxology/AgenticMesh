agent:
  name: brodagroupsoftware:agent-bank-kyc
  purpose: |
    This agent is an expert in a bank's KYC, or "know your customer", process in a bank.
  description: |
    This agent will complete a KYC (know your customer) process to
    understand a customer's profile.
    This agent can coordinate the end-to-end process required to fulfill
    KYC, or "know your customer", process during a bank account open process.
    It expects serveral documents including
    - the customer's drivers license
    - the customer's passport document
  module: tools.brodagroupsoftware.agent.tool
  url: http://agent-bank-kyc:8000
  version: v0.0.1
  approach: |
    The following steps are required to perform this process:
    1. Identify the tool to perform KYC. The tool for this is 'tool.bank.kyc'
    2. Execute tool to perform KYC
  parameters:
    - name: customer_name
      type: string
      description: "The name of the customer"
  tools:
    - name: tool.llm
      purpose: To think, determine task plans
      description: Process natural language requests using a Large Language Model
      module: tools.brodagroupsoftware.llm.tool
    - name: tool.bank.kyc
      purpose: Perform Know Your Customer (KYC) process
      description: Perform Know Your Customer (KYC) process
      module: tools.brodagroupsoftware.bank.kyc
  agents: []
  logging: INFO

registry:
  # host: localhost
  host: xagenticmesh-registry
  port: 8000
  retry_interval: 10  # seconds
  refresh_timeout: 300

monitor:
  # host: localhost
  host: xagenticmesh-monitor
  port: 8000
  retry_interval: 10  # seconds
  refresh_timeout: 15
